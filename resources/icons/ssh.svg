<?xml version="1.0" encoding="UTF-8"?>
<!-- New SSH Session: a terminal window with a padlock. Monochrome, currentColor-free (Qt's SVG
     icon engine has no CSS context), sized like the toolbar's 16 px glyphs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="none" stroke="#404040" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <!-- terminal window -->
    <rect x="1" y="2" width="14" height="10" rx="1.5"/>
    <line x1="1" y1="4.75" x2="15" y2="4.75"/>
    <!-- prompt chevron and cursor line -->
    <polyline points="3.25,7 5.25,8.75 3.25,10.5"/>
    <line x1="6.5" y1="10.5" x2="9" y2="10.5"/>
    <!-- padlock, bottom right -->
    <path d="M10.75 9.5 V8.25 a1.75 1.75 0 0 1 3.5 0 V9.5"/>
  </g>
  <rect x="9.75" y="9.5" width="5.5" height="5" rx="0.75" fill="#404040"/>
  <circle cx="12.5" cy="11.75" r="0.6" fill="#ffffff"/>
</svg>

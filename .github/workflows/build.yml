name: Build and Test

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  build-ubuntu:
    name: Ubuntu (GCC, Ninja)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the git hash in Version.h is meaningful

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtserialport'
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSU_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Verify executable
        run: |
          test -x build/BuildAI-SerialUtility
          file build/BuildAI-SerialUtility

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: BuildAI-SerialUtility-linux-x64
          path: |
            build/BuildAI-SerialUtility
            README.md
            VERSION.txt
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows (MSVC 2022, Ninja)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtserialport'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl.exe -DSU_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install and deploy (windeployqt)
        shell: pwsh
        run: |
          cmake --install build --prefix dist --config Release
          if (-not (Test-Path "dist\bin\BuildAI-SerialUtility.exe")) {
            Write-Error "dist\bin\BuildAI-SerialUtility.exe not found after install"
            exit 1
          }
          Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BuildAI-SerialUtility-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: BuildAI-SerialUtility-linux-x64
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BuildAI-SerialUtility-windows-x64
          path: artifacts/windows

      - name: Create release archives
        run: |
          mkdir -p release
          chmod +x artifacts/linux/build/BuildAI-SerialUtility || true
          tar -czf "release/BuildAI-SerialUtility-${{ github.ref_name }}-linux-x64.tar.gz" -C artifacts/linux .
          (cd artifacts/windows && zip -r "../../release/BuildAI-SerialUtility-${{ github.ref_name }}-windows-x64.zip" .)
          ls -la release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BuildAI-SerialUtility-${{ github.ref_name }}-linux-x64.tar.gz
            release/BuildAI-SerialUtility-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
